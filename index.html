<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c62828">
<meta name="description" content="VLXD Nam Sơn — tra cứu sàn, thiết bị vệ sinh, phụ kiện và tồn kho">
<!-- Ảnh Google Drive bị chặn nếu gửi kèm Referer khi tải nhiều ảnh liền nhau -->
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nam Sơn">
<title>VLXD Nam Sơn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo"><img src="icons/icon-192.png" alt=""><span class="store-name">VLXD Nam Sơn</span></div>
    <nav class="tabs" id="tabs" aria-label="Danh mục"></nav>
  </aside>

  <main class="content">
    <div class="mobile-head"><img src="icons/icon-192.png" alt=""><span class="store-name">VLXD Nam Sơn</span></div>
    <p class="stamp" id="stamp">&nbsp;</p>

    <div class="toolbar">
      <label class="searchbox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Tìm mã, tên, màu, nhãn hiệu…" autocomplete="off" enterkeyhint="search">
        <button type="button" class="searchbox-clear" id="searchClear" aria-label="Xoá tìm kiếm">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </label>
      <button type="button" class="filter-btn" id="filterBtn" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M10 18h4"/></svg>
        Lọc <span class="filter-count" id="filterCount" hidden></span>
      </button>
      <button type="button" class="promo-btn" id="promoBtn" data-act="togglePromo" hidden></button>
      <div class="filter-panel" id="filterPanel"></div>
    </div>

    <p class="result-count" id="resultCount"></p>
    <div class="cards" id="cards"></div>
  </main>
</div>

<!-- Popup chi tiết -->
<div class="sheet-backdrop" id="backdrop">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<!-- Xem ảnh toàn màn hình -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bg" id="viewerBg"></div>
  <img id="viewerImg" alt="">
  <button type="button" class="viewer-close" id="viewerClose" aria-label="Đóng ảnh">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <button type="button" class="viewer-nav prev" id="viewerPrev" aria-label="Ảnh trước" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
  </button>
  <button type="button" class="viewer-nav next" id="viewerNext" aria-label="Ảnh sau" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
  </button>
  <div class="viewer-count" id="viewerCount" hidden></div>
  <div class="viewer-hint" id="viewerHint">Chụm 2 ngón để phóng to · vuốt để đóng</div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="config.js"></script>
<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
